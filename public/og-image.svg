<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="SEE GPA Calculator by Seepapers.com">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#171a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7928ca"/>
      <stop offset="0.55" stop-color="#007cf0"/>
      <stop offset="1" stop-color="#00dfd8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- dotted grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="240" cy="80" r="2"/>
    <circle cx="1040" cy="540" r="2"/><circle cx="1120" cy="540" r="2"/><circle cx="960" cy="540" r="2"/>
  </g>

  <text x="80" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#9aa3c0" font-weight="600" letter-spacing="2">SEEPAPERS.COM</text>

  <text x="80" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" fill="#ffffff">SEE GPA</text>
  <text x="80" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#accent)">Calculator</text>

  <text x="80" y="468" font-family="Segoe UI, Arial, sans-serif" font-size="34" fill="#c7cde0" font-weight="500">NEB Grade Point Average for Nepali Class 10 students</text>

  <!-- feature pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#e6e9f5" font-weight="600">
    <rect x="80" y="510" rx="26" width="230" height="52" fill="#ffffff" opacity="0.08"/>
    <text x="105" y="544">GPA from marks</text>
    <rect x="330" y="510" rx="26" width="200" height="52" fill="#ffffff" opacity="0.08"/>
    <text x="355" y="544">GPA Planner</text>
    <rect x="550" y="510" rx="26" width="250" height="52" fill="#ffffff" opacity="0.08"/>
    <text x="575" y="544">+2 Eligibility</text>
    <rect x="820" y="510" rx="26" width="290" height="52" fill="#ffffff" opacity="0.08"/>
    <text x="845" y="544">Marksheet Generator</text>
  </g>

  <!-- GPA badge -->
  <circle cx="1010" cy="220" r="120" fill="none" stroke="url(#accent)" stroke-width="14"/>
  <text x="1010" y="205" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">4.0</text>
  <text x="1010" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#00dfd8">A+ GPA</text>
</svg>
